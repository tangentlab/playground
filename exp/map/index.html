<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1117">
  <title>City Map · Ryan's Playground</title>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.138/Build/Cesium/Cesium.js"></script>
  <link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.138/Build/Cesium/Widgets/widgets.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Outfit:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="map-shell">
    <div id="cesiumContainer" class="map-canvas" aria-label="Interactive 3D city map"></div>

    <header class="map-header">
      <a class="back-button" href="../../" aria-label="Back to experiments">
        <span aria-hidden="true">←</span>
        <span>Playground</span>
      </a>
      <div class="place-card">
        <span class="eyebrow">CITY MAP</span>
        <h1>San Francisco</h1>
        <p>Explore terrain and buildings in 3D</p>
      </div>
    </header>

    <div class="map-actions" aria-label="Map controls">
      <button id="homeButton" class="map-button" type="button" aria-label="Return to city view" title="Return to city view">
        <span aria-hidden="true">⌂</span>
      </button>
      <button id="viewButton" class="map-button" type="button" aria-label="Switch map angle" title="Switch map angle">
        <span aria-hidden="true">◩</span>
      </button>
    </div>

    <div id="mapStatus" class="map-status" role="status">
      <span class="status-dot" aria-hidden="true"></span>
      <span>Loading the city…</span>
    </div>

    <aside class="map-hint">
      <span>Drag to orbit</span>
      <span class="separator" aria-hidden="true"></span>
      <span>Scroll to zoom</span>
    </aside>
  </main>

  <script type="module" src="city-map.js"></script>
</body>
</html>
